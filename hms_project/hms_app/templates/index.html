{% extends "base.html" %}

{% block content %}
<div class="jumbotron text-center">
    <h1 class="display-4">Welcome to Hospital Management System</h1>
    <p class="lead">A simple and efficient way to manage hospital operations.</p>
    <hr class="my-4">
    <p>Login or Register to get started.</p>
    {% if not current_user.is_authenticated %}
    <a class="btn btn-primary btn-lg" href="{{ url_for('auth.login') }}" role="button">Login</a>
    <a class="btn btn-secondary btn-lg" href="{{ url_for('auth.register') }}" role="button">Register</a>
    {% endif %}
</div>
{% endblock %}
