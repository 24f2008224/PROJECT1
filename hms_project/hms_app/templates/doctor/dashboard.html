{% extends "base.html" %}

{% block content %}
<div class="container">
    <h2>Doctor Dashboard</h2>

    <div class="row mt-4 mb-4">
        <div class="col-md-12">
            <div class="card">
                <div class="card-header">Update Availability</div>
                <div class="card-body">
                    <form action="{{ url_for('doctor.update_availability') }}" method="POST">
                        <div class="input-group">
                            <textarea name="availability" class="form-control" placeholder="e.g. Mon: 9-5, Tue: 9-5">{{ doctor.availability if doctor.availability else '' }}</textarea>
                            <button class="btn btn-primary" type="submit">Update</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <div class="row mt-4">
        <div class="col-md-12">
            <h3>My Appointments</h3>
             <table class="table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Patient</th>
                        <th>Date</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    {% for appt in appointments %}
                    <tr>
                        <td>{{ appt.id }}</td>
                        <td>{{ appt.patient.user.username }}</td>
                        <td>{{ appt.date_time }}</td>
                        <td>{{ appt.status }}</td>
                        <td>
                            <a href="{{ url_for('doctor.manage_appointment', appt_id=appt.id) }}" class="btn btn-sm btn-info">Manage</a>
                            <a href="{{ url_for('doctor.patient_history', patient_id=appt.patient.id) }}" class="btn btn-sm btn-secondary">History</a>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
